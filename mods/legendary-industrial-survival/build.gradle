plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.78'
}

// Each mod remains buildable on its own or as part of the collection.
def modProperties = new Properties()
file('gradle.properties').withInputStream { modProperties.load(it) }
modProperties.each { key, value ->
    if (!key.startsWith('org.gradle.')) { extensions.extraProperties.set(key, value) }
}

version = project.mod_version
group = project.mod_group_id

base {
    archivesName = project.mod_id
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

sourceSets {
    gametest {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}
configurations.gametestImplementation.extendsFrom(configurations.implementation)
configurations.gametestCompileOnly.extendsFrom(configurations.compileOnly)
configurations.gametestRuntimeOnly.extendsFrom(configurations.runtimeOnly)

neoForge {
    version = project.neo_version
    addModdingDependenciesTo sourceSets.gametest

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client { client() }
        server {
            server()
            programArgument '--nogui'
        }
        gameTestServer {
            type = 'gameTestServer'
            gameDirectory = file('build/gametest')
            jvmArgument '-Xmx2G'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
    }

    mods {
        "${project.mod_id}" {
            sourceSet(sourceSets.main)
            sourceSet(sourceSets.gametest)
        }
    }
    unitTest {
        enable()
        testedMod = mods.legendary_industrial_survival
    }
}

repositories {
    mavenCentral()
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
    maven {
        name = 'Create'
        url = 'https://maven.createmod.net'
        content { includeGroup 'net.createmod.ponder'; includeGroup 'dev.engine-room.flywheel' }
    }
    maven {
        name = 'Registrate'
        url = 'https://maven.ithundxr.dev/snapshots'
        content { includeGroup 'com.tterrag.registrate' }
    }
}

dependencies {
    // legendarysurvivaloverhaul-1.21.1-2.4.5.jar
    compileOnly('maven.modrinth:TQr3t8Sb:qVabfOA6') { transitive = false }
    // create-1.21.1-6.0.10.jar
    compileOnly('maven.modrinth:LNytGWDc:UjX6dr61') { transitive = false }
    // Mekanism-1.21.1-10.7.19.85.jar
    compileOnly('maven.modrinth:Ce6I4WUE:5KzzycBT') { transitive = false }
    // sophisticatedbackpacks-1.21.1-3.25.71.1997.jar
    compileOnly('maven.modrinth:TyCTlI4b:77ZcitZl') { transitive = false }
    // sophisticatedcore-1.21.1-1.4.75.2161.jar
    compileOnly('maven.modrinth:nmoqTijg:o0NtJ8Zz') { transitive = false }
    // irons_spellbooks-1.21.1-3.16.2.jar
    compileOnly('maven.modrinth:s4OWxYQQ:RtvqnbKi') { transitive = false }
    compileOnly('net.createmod.ponder:ponder-neoforge:1.0.82+mc1.21.1') { transitive = false }
    compileOnly('dev.engine-room.flywheel:flywheel-neoforge-api-1.21.1:1.0.6') { transitive = false }
    compileOnly('com.tterrag.registrate:Registrate:MC1.21-1.3.0+67') { transitive = false }
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(ProcessResources).configureEach {
    def replaceProperties = [
            minecraft_version_range: minecraft_version_range,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description
    ]
    inputs.properties replaceProperties
    filesMatching('META-INF/neoforge.mods.toml') {
        expand replaceProperties
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

tasks.withType(JavaExec).configureEach {
    standardInput = System.in
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
    testLogging { events 'failed', 'skipped' }
}

tasks.withType(Jar).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
    from(rootProject.file('LICENSE'))
}

apply from: 'gradle/runtime-dependencies.gradle'
