pluginManagement {
    repositories {
        gradlePluginPortal()
        mavenCentral()
        maven { url = 'https://maven.neoforged.net/releases' }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.8.0'
}

rootProject.name = 'minecraft-integrations'
include 'arcane', 'industrial'
project(':arcane').projectDir = file('mods/legendary-arcane-survival')
project(':industrial').projectDir = file('mods/legendary-industrial-survival')
